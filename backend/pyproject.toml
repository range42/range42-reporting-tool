# Versions = latest stable as of 2026-06-08 (web-verified). uv resolves the newest
# compatible release at `uv sync` and pins exact versions in uv.lock.
# If `uv sync` fails because a C-extension (asyncpg/psycopg) lacks a 3.14 wheel,
# fall back to requires-python ">=3.13" + python:3.13-slim and note it.
[project]
name = "reporting-tool-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.136",
  "uvicorn[standard]>=0.49",
  "sqlalchemy[asyncio]>=2.0.50",
  "asyncpg>=0.31",
  "alembic>=1.18",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "structlog>=26.1",
  "python-multipart>=0.0.32",
  "psycopg[binary]>=3.3",
  "pyjwt[crypto]>=2.10",
  "authlib>=1.6",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "testcontainers[postgres]>=4.14",
  "ruff>=0.15",
  "mypy>=2.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a database"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
