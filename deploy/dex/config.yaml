# Dev-only OIDC provider. Not used by the prod overlay.
#
# `issuer` must resolve to this service both from inside the compose network,
# where the backend fetches discovery at boot, and from wherever the browser
# runs, since it follows the login redirect. The `iss` claim has to match on
# both sides, so the two cannot use different names.
issuer: http://dex:5556/dex

# No database in dev — every login is a fresh grant, and nothing needs to
# survive a restart. Persona role grants live in Postgres, not here.
storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # No consent click between login and callback.
  skipApprovalScreen: true

staticClients:
  - id: reporting-tool
    name: Range42 Reporting Tool
    secret: changeme
    # Must match OIDC_REDIRECT_URI exactly: the value is replayed to the token
    # endpoint, and it points at the FRONTEND route (AuthCallback.vue), which
    # reads code/state and then calls the backend callback itself.
    redirectURIs:
      - http://localhost:5173/auth/callback

enablePasswordDB: true

# Emails are the join key used by the grants seeding step to match a logged-in
# user to their persona roles. A typo here surfaces as a login that succeeds
# but grants nothing, so keep this list in step with seed_demo.PERSONAS.
#
# The emergency admin (admin@localhost) is deliberately absent: it is the
# break-glass path that must keep working when the IdP does not.
#
# All passwords are `changeme` (bcrypt, cost 10). Regenerate a hash with:
#   python3 -c "import bcrypt;print(bcrypt.hashpw(b'<pw>',bcrypt.gensalt(rounds=10)).decode())"
staticPasswords:
  - email: admin@range42.local
    username: admin
    userID: admin
    hash: "$2b$10$FewCdiytGXbWKp/N8h3DleZD/YY0LrxlL41aJJbLZFA3rV7JeMghK"
  - email: alice@range42.local
    username: alice
    userID: alice
    hash: "$2b$10$TRThLSJMlpyeDpHpKp0rtulAqpfbW21XugYmxrSlCamJQV1Lrvznq"
  - email: bob@range42.local
    username: bob
    userID: bob
    hash: "$2b$10$sLRUbEQ6tXlUYJU14cgH6eZ.o/mCmhJx7soUI94BHkLIqyO8eNS0O"
  - email: carol@range42.local
    username: carol
