name: ci
on:
  push: { branches: [main, dev] }
  pull_request: {}
  workflow_dispatch: {}   # allow manual full-suite runs (ignores path filters)

permissions:
  contents: read        # actions/checkout needs this; an explicit block defaults all other scopes to none
  pull-requests: read   # dorny/paths-filter reads the PR file list via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            backend: ['backend/**', 'deploy/**']
            frontend: ['frontend/**']
            deploy: ['backend/**', 'frontend/**', 'deploy/**']

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: reporting, POSTGRES_PASSWORD: changeme, POSTGRES_DB: reporting }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reporting" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://reporting:changeme@localhost:5432/reporting
      JWT_SECRET: ci-test-secret-0123456789-0123456789-xx
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0   # no moving `v8` tag is published; pin the exact release
      - run: cd backend && uv sync --frozen
      - run: cd backend && uv run ruff check . && uv run ruff format --check .
      - run: cd backend && uv run mypy app
      - run: cd backend && uv run pytest -m "not integration"
      - run: cd backend && uv run pytest -m integration

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }   # reads the pinned packageManager (no root package.json)
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec eslint . && pnpm exec prettier --check .
      - run: cd frontend && pnpm exec vitest run
      - run: cd frontend && pnpm build

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }   # reads the pinned packageManager (no root package.json)
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: pnpm add -g @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD

  docker-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Boot the prod overlay (Caddy reverse proxy) so we can verify §9.7:
    # `curl / through Caddy returns index.html`. TLS_MODE=internal makes Caddy
    # mint a self-signed cert (no ACME), so curl with -k works against localhost.
    env:
      DOMAIN: localhost
      TLS_MODE: internal
      TLS_CONFIG: internal
    steps:
      - uses: actions/checkout@v6
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
      - name: wait + assert SPA and API through Caddy
        run: |
          set -x
          # Wait for the API through Caddy (Caddy + backend ready).
          for i in $(seq 1 40); do
            curl -fsSk https://localhost/api/v1/ping && break || sleep 3
          done
          curl -fsSk https://localhost/api/v1/ping | grep -q '"status":"ok"'
          # §9.7: the SPA index.html is served at / through Caddy. Retry — the one-shot
          # frontend dist-copy can lag Caddy's start.
          for i in $(seq 1 20); do
            curl -fsSk https://localhost/ | grep -qi '<!doctype html' && break || sleep 3
          done
          curl -fsSk https://localhost/ | grep -qi '<!doctype html'
          # API proxied through Caddy returns the readiness envelope. Our JSON is COMPACT
          # (Starlette JSONResponse separators are ",":") so match without spaces.
          curl -fsSk https://localhost/api/v1/health | grep -q '"oidc_provider":"disabled"'
      - name: dump compose state on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml ps -a || true
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml logs --tail=80 || true
      - name: assert prod overlay exposes only Caddy ports
        run: |
          DOMAIN=example.test docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config \
            | grep "published:" | grep -vE '"(80|443)"' && exit 1 || echo "ok: only 80/443 published"

  # RESERVED (F8) — TLS-mode + air-gap smoke matrix. Gated off (`if: false`) so the
  # matrix *shape* exists now without running. Wired live in V1-ROADMAP WP8-A
  # (multi-mode TLS: internal CA) and WP8-D (network-isolated / air-gapped boot).
  # TODO(WP8-A/D): drop `if: false`, fill in the per-mode boot + assertions.
  docker-smoke-reserved:
    needs: changes
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # WP8-A: boot with Caddy's internal self-signed CA (no ACME reachable).
          - mode: tls-internal
            tls_mode: internal
            isolated: false
          # WP8-D: boot on an internal-only docker network with no egress.
          - mode: air-gap
            tls_mode: internal
            isolated: true
    steps:
      - uses: actions/checkout@v6
      - run: cp deploy/.env.example deploy/.env
      # TODO(WP8-A/D): set TLS_MODE=${{ matrix.tls_mode }}; when
      # ${{ matrix.isolated }} is true, bring the stack up on an internal-only
      # network (no egress) and assert the backend still answers /api/v1/ping.
      - run: echo "reserved smoke slot ${{ matrix.mode }} (TLS_MODE=${{ matrix.tls_mode }}, isolated=${{ matrix.isolated }})"
