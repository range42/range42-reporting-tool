name: ci
on:
  push: { branches: [main, dev] }
  pull_request: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            backend: ['backend/**', 'deploy/**']
            frontend: ['frontend/**']
            deploy: ['backend/**', 'frontend/**', 'deploy/**']

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: reporting, POSTGRES_PASSWORD: changeme, POSTGRES_DB: reporting }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reporting" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://reporting:changeme@localhost:5432/reporting
      JWT_SECRET: ci-test-secret-0123456789-0123456789-xx
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
      - run: cd backend && uv sync
      - run: cd backend && uv run ruff check . && uv run ruff format --check .
      - run: cd backend && uv run mypy app
      - run: cd backend && uv run pytest -m "not integration"
      - run: cd backend && uv run pytest -m integration

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec eslint . && pnpm exec prettier --check .
      - run: cd frontend && pnpm exec vitest run
      - run: cd frontend && pnpm build

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: pnpm add -g @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml build
      - run: docker compose -f deploy/docker-compose.yml up -d
      - name: wait + assert backend
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/ping && break || sleep 3
          done
          curl -fsS http://localhost:8000/api/v1/health | grep -q '"oidc_provider": "disabled"'
      - name: assert prod overlay exposes only Caddy ports
        run: |
          DOMAIN=example.test docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config \
            | grep "published:" | grep -vE '"(80|443)"' && exit 1 || echo "ok: only 80/443 published"
